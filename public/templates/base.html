<!DOCTYPE html>
<html>
<head>
    <title>CRM + Financeiro + Fidelidade</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Sistema Integrado</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/clientes">Clientes</a>
                <a class="nav-link" href="/vendas/nova">Nova Venda</a>
                <a class="nav-link" href="/parcelas">Parcelas</a>
                <a class="nav-link" href="{{ url_for('cliente_acesso') }}">Área do Cliente</a>
                <a class="nav-link" href="{{ url_for('painel_operador') }}">Painel da Loja</a>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for msg in messages %}
                    <div class="alert alert-success">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
    <!-- ===== ATALHO FLUTUANTE: ESCANEAR CLIENTE ===== -->
{% if mostrar_atalho_qr %}
<a href="{{ url_for('ler_qrcode') }}"
   class="btn btn-primary rounded-circle shadow-lg position-fixed d-flex align-items-center justify-content-center"
   style="bottom: 20px; right: 20px; width: 70px; height: 70px; z-index: 1050;"
   title="Escanear cliente">
    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 16 16">
        <path d="M0 .5A.5.5 0 0 1 .5 0h3a.5.5 0 0 1 0 1H1v2.5a.5.5 0 0 1-1 0v-3Zm12 0a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 .5.5v3a.5.5 0 0 1-1 0V1h-2.5a.5.5 0 0 1-.5-.5ZM1 12.5a.5.5 0 0 1 1 0V15h2.5a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5v-3Zm14 0a.5.5 0 0 1-1 0V15h-2.5a.5.5 0 0 1 0-1h3a.5.5 0 0 1 .5.5v-3Z"/>
        <path d="M4 4h2v2H4V4Zm0 3h2v2H4V7Zm0 3h2v2H4v-2Zm3-6h2v2H7V4Zm0 3h2v2H7V7Zm0 3h2v2H7v-2Zm3-6h2v2h-2V4Zm0 3h2v2h-2V7Zm0 3h2v2h-2v-2Z"/>
    </svg>
</a>
{% endif %}
</body>
</html>
