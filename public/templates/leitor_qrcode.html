<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor de QR — Operação de Loja</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
<div class="container py-4">
    <h1 class="h4 mb-3">Leitor de QR Code do Cliente</h1>

<!-- acima do <div id="reader"> -->
<div class="card mb-3 shadow-sm">
    <div class="card-body">
        <label for="input-id-fallback" class="form-label small">Câmera não funciona? Digite o ID:</label>
        <div class="input-group">
            <input type="number" id="input-id-fallback" class="form-control form-control-lg" placeholder="ID do cliente" inputmode="numeric">
            <button id="btn-fallback" class="btn btn-primary">Buscar</button>
        </div>
    </div>
</div>

    <div id="reader" style="width:100%; max-width:400px; margin:auto;"></div>

    <div id="resultado" class="alert alert-info mt-3 d-none"></div>

    <div class="d-grid gap-2 mt-3">
        <a href="{{ url_for('nova_venda') }}" class="btn btn-outline-secondary">
            Cadastrar venda manualmente
        </a>
    </div>
</div>

<script>
const resultado = document.getElementById('resultado');
let processando = false;

async function onScanSuccess(texto) {
    if (processando) return;            // evita leituras duplicadas
    processando = true;

    resultado.classList.remove('d-none', 'alert-info', 'alert-danger', 'alert-success');
    resultado.classList.add('alert-info');
    resultado.innerHTML = `QR lido: <strong>${texto}</strong><br>Validando...`;

    try {
        const resp = await fetch('/api/qrcode/validar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ payload: texto })
        });
        const data = await resp.json();

        if (!data.ok) throw new Error(data.erro || 'QR inválido');

        const c = data.cliente;
        resultado.classList.replace('alert-info', 'alert-success');
        resultado.innerHTML = `
            <strong>${c.nome}</strong> identificado(a) — ${c.pontos} pontos<br>
            Redirecionando para registrar a compra...
        `;

        // Redireciona para a nova venda com o cliente pré-selecionado
        setTimeout(() => {
            window.location.href = `/vendas/nova?cliente_id=${c.id}`;
        }, 800);

    } catch (err) {
        resultado.classList.replace('alert-info', 'alert-danger');
        resultado.textContent = 'Erro: ' + err.message;
        processando = false;            // permite tentar de novo
    }
}

document.getElementById('btn-fallback').addEventListener('click', async () => {
    const id = document.getElementById('input-id-fallback').value.trim();
    if (!id) return;
    await onScanSuccess(`cliente:${id}:fallback`);
});

const scanner = new Html5QrcodeScanner('reader', {
    fps: 10,
    qrbox: { width: 250, height: 250 }
});
scanner.render(onScanSuccess);
</script>
</body>
</html>
