{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-12">
        <h1 class="text-center mb-4">Área do Cliente</h1>
        <form method="POST" action="{{ url_for('cliente_acesso_post') }}">
            <div class="mb-3">
                <label for="cliente_id" class="form-label">Digite seu ID de cliente</label>
                <input type="number" class="form-control form-control-lg" id="cliente_id" name="cliente_id" placeholder="Ex.: 123" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100">Acessar</button>
        </form>
        <p class="text-muted mt-3 text-center">Seu ID está no cadastro da loja.</p>
    </div>
</div>
{% endblock %}
